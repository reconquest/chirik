version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: all
  disable:
    - gomodguard
    - decorder
    - err113
    - exhaustruct
    - exhaustruct_v5
    - funcorder
    - godoclint
    - gomoddirectives
    - grouper
    - importas
    - perfsprint
    - wsl
  settings:
    bodyclose:
      check-consumption: true
    copyloopvar:
      check-alias: true
    cyclop:
      max-complexity: 10
      package-average: 0
    depguard:
      rules:
        project-imports:
          list-mode: strict
          allow:
            - $gostd
            - chirik
            - github.com/kovetskiy/docopt-go
            - github.com/charmbracelet/log
            - github.com/reconquest/karma-go
    embeddedstructfieldcheck:
      forbid-mutex: true
    errcheck:
      check-type-assertions: true
      check-blank: false
      disable-default-exclusions: true
    errchkjson:
      check-error-free-encoding: true
      report-no-exported: true
    exhaustive:
      check:
        - switch
        - mapliteral
      default-case-required: true
    fatcontext:
      check-struct-pointers: true
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
    ginkgolinter:
      forbid-focus-container: true
      force-expect-to: true
      validate-async-intervals: true
      forbid-spec-pollution: true
      force-succeed: true
      force-assertion-description: true
      force-tonot: true
    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true
    gocognit:
      min-complexity: 20
    goconst:
      min-occurrences: 4
      numbers: false
      ignore-calls: true
      ignore-tests: true
      find-duplicates: false
      eval-const-expressions: false
    gocritic:
      enable-all: true
      disabled-checks:
        - unnamedResult
    gocyclo:
      min-complexity: 10
    godot:
      scope: all
      capital: true
    gomodguard_v2:
      local-replace-directives: true
      allowed:
        - module: github.com/charmbracelet/log
        - module: github.com/kovetskiy/docopt-go
        - module: github.com/reconquest/karma-go
        - module: github.com/reconquest/karma-go/cmd/karmalint
        - module: golang.org/x/mod
        - module: golang.org/x/sync
        - module: golang.org/x/tools
    gosec:
      excludes:
        - G104
      config:
        global:
          nosec: false
          show-ignored: false
          audit: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
      settings:
        shadow:
          strict: true
    ineffassign:
      check-escaping-errors: true
    iotamixing:
      report-individual: true
    loggercheck:
      require-string-key: true
      no-printf-like: true
    makezero:
      always: false
    nilnil:
      only-two: false
      detect-opposite: true
    nolintlint:
      require-specific: true
      require-explanation: true
    nonamedreturns:
      report-error-in-defer: true
    paralleltest:
      ignore-missing: true
      ignore-missing-subtests: true
      check-cleanup: true
    prealloc:
      for-loops: true
    predeclared:
      qualified-name: true
    promlinter:
      strict: true
    protogetter:
      replace-first-arg-in-append: true
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: line-length-limit
          arguments: [80]
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: confusing-results
          disabled: true
        - name: cognitive-complexity
          arguments: [20]
        - name: function-result-limit
          arguments: [5]
    tagalign:
      strict: true
    testifylint:
      enable-all: true
      formatter:
        require-f-funcs: true
    unparam:
      check-exported: true
    unqueryvet:
      check-n1: true
      check-sql-injection: true
      check-tx-leaks: true
    unused:
      field-writes-are-uses: false
      exported-fields-are-used: false
      parameters-are-used: false
      local-variables-are-used: false
      generated-is-used: false
    usestdlibvars:
      time-date-month: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true
    varnamelen:
      check-receiver: true
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
    whitespace:
      multi-if: false
      multi-func: false
    wrapcheck:
      report-internal-errors: false
    wsl_v5:
      default: all
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 1
  exclusions:
    generated: strict
    paths:
      - ^internal/pulse/
    rules:
      - text: "github.com/reconquest/karma-go"
        linters:
          - wrapcheck
      - path: ^internal/adpcm/adpcm\.go$
        linters:
          - gochecknoglobals
      - path: ^cmd/chirik/client\.go$
        linters:
          - containedctx
      - path: ^cmd/chirik/terminal\.go$
        linters:
          - nilerr
          - nilnil
      - text: "G103"
        path: ^cmd/chirik/terminal\.go$
        linters:
          - gosec
      - text: "G115"
        path: ^(cmd/chirik/chirp_audio\.go|internal/(adpcm|audio|proto)/.*\.go)$
        linters:
          - gosec
      - path: ^cmd/chirik/exchange_relay\.go$
        linters:
          - dogsled
      - path: ^cmd/chirik/terminal\.go$
        linters:
          - unqueryvet
      - path: ^internal/adpcm/adpcm\.go$
        text: "confusing-naming: Method 'decode'"
        linters:
          - revive
      - path: ^cmd/chirik/client\.go$
        text: "type manager is unused"
        linters:
          - unused
      - text: "don't use underscores in Go names; const (linkState_|Type_)"
        linters:
          - revive
      - path: _test\.go
        linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
      - path: _test\.go
        text: "function-length:"
        linters:
          - revive
      - path: _test\.go
        text: "cognitive-complexity:"
        linters:
          - revive
      - path: _test\.go
        text: "cyclomatic:"
        linters:
          - revive

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - alias
        - localmodule
      no-inline-comments: true
      no-prefix-comments: true
      custom-order: true
    gofumpt:
      module-path: chirik
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - chirik
    golines:
      max-len: 80
      shorten-comments: true
  exclusions:
    generated: strict
    paths:
      - ^internal/pulse/
      - _test\.go
    warn-unused: true
